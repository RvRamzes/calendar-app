<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планувальник графіку</title>
    
    <!-- PWA Підключення -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png" type="image/png">
    
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <!-- Навігація між сторінками -->
    <nav style="background: #333; padding: 10px; text-align: center; position: sticky; top: 0; z-index: 1000;">
        <a href="index.html" style="color: white; margin-right: 20px; text-decoration: none; font-family: sans-serif; font-weight: bold;">Сторінка 1</a>
        <a href="index2.html" style="color: white; text-decoration: none; font-family: sans-serif;">Сторінка 2</a>
    </nav>

    <h1>Планувальник графіку</h1>

    <!-- Панель керування (З Варіанта 1) -->
    <div class="controls">
        <div class="panel role-panel">
            <span class="panel-title">Тип зміни:</span>
            <div class="role-buttons">
                <button id="btnSeller" class="role-seller">R. V.</button>
                <button id="btnLoader" class="role-loader">D SkV</button>
            </div>
            <label class="birzha-label">
                <input type="checkbox" id="birzhaCheckbox"> Біржа
            </label>
        </div>

        <div class="panel hours-panel">
            <span class="panel-title">Години:</span>
            <div class="hours-buttons">
                <button class="btnHour" data-hours="10">10 год</button>
                <button class="btnHour" data-hours="9.5">9.5 год</button>
            </div>
            <input id="customHours" type="number" placeholder="власні (0.5)" step="0.5" min="0" />
        </div>
    </div>

    <!-- Вибір місяця: Стрілочки + Select -->
    <div class="month-nav">
        <button id="prevMonth">←</button>
        
        <select id="monthSelect">
            <option value="0">Січень</option>
            <option value="1">Лютий</option>
            <option value="2">Березень</option>
            <option value="3">Квітень</option>
            <option value="4">Травень</option>
            <option value="5">Червень</option>
            <option value="6">Липень</option>
            <option value="7">Серпень</option>
            <option value="8">Вересень</option>
            <option value="9">Жовтень</option>a
            <option value="10">Листопад</option>
            <option value="11">Грудень</option>
        </select>

        <button id="nextMonth">→</button>
    </div>

    <!-- Календар: 8 колонок (Дні + За тиждень) -->
    <div class="calendar" id="calendar">
        <div class="day-name">Пн</div>
        <div class="day-name">Вт</div>
        <div class="day-name">Ср</div>
        <div class="day-name">Чт</div>
        <div class="day-name">Пт</div>
        <div class="day-name">Сб</div>
        <div class="day-name">Нд</div>
        <div class="day-name week-summary-head">За тиждень</div>
    </div>

    <!-- Детальна підсумкова таблиця -->
    <div class="summary-container" aria-live="polite">
        <table id="summaryTable" class="summary-table">
            <thead>
                <tr>
                    <th>Тип зміни</th>
                    <th>Базові / Біржа / Всього (год)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>R. V.</td>
                    <td id="sumSeller">0 / 0 / 0</td>
                </tr>
                <tr>
                    <td>D SkV</td>
                    <td id="sumLoader">0 / 0 / 0</td>
                </tr>
                <tr>
                    <td><strong>Усього</strong></td>
                    <td id="sumTotal"><strong>0 / 0 / 0</strong></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Кнопки дій -->
    <div class="actions">
        <button id="exportExcel" class="secondary">Експортувати в Excel</button>
        <button id="clearMonth" class="danger">Очистити місяць</button>
    </div>

    <!-- Бібліотека для Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.1/xlsx.full.min.js"></script>
    <script src="script1.js"></script>
</body>
</html>
