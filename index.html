<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чия Зміна?</title>
    
    <!-- PWA Підключення -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png" type="image/png">
    
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <!-- Навігація між сторінками -->
    <nav class="top-nav">
        <a href="index.html" class="nav-link active">Сторінка 1</a>
        <a href="index2.html" class="nav-link">Сторінка 2</a>
    </nav>

    <h1>Чия Зміна?</h1>

    <!-- Панель керування (Вибір ролі та годин) -->
    <div class="controls">
        <div class="panel role-panel">
            <span class="panel-title">Хто в ділі:</span>
            <div class="role-buttons">
                <button id="btnSeller" class="role-seller">⚡ R. V.</button>
                <button id="btnLoader" class="role-loader">🛡️ D SkV</button>
            </div>
            <label class="birzha-label">
                <input type="checkbox" id="birzhaCheckbox"> Біржа
            </label>
        </div>

        <div class="panel hours-panel">
            <span class="panel-title">Години:</span>
            <div class="hours-buttons">
                <button class="btnHour" data-hours="11">11 год</button>
                <button class="btnHour" data-hours="8">8 год</button>
            </div>
            <input id="customHours" type="number" placeholder="власні (0.5)" step="0.5" min="0" />
        </div>
    </div>

    <!-- Вибір місяця: Стрілочки + Select -->
    <div class="month-nav">
        <button id="prevMonth" aria-label="Попередній місяць">←</button>
        
        <select id="monthSelect">
            <option value="0">Січень</option>
            <option value="1">Лютий</option>
            <option value="2">Березень</option>
            <option value="3">Квітень</option>
            <option value="4">Травень</option>
            <option value="5">Червень</option>
            <option value="6">Липень</option>
            <option value="7">Серпень</option>
            <option value="8">Вересень</option>
            <option value="9">Жовтень</option>
            <option value="10">Листопад</option>
            <option value="11">Грудень</option>
        </select>

        <button id="nextMonth" aria-label="Наступний місяць">→</button>
    </div>

    <!-- Календар: 8 колонок (Генерується динамічно через script1.js) -->
    <div class="calendar" id="calendar"></div>

    <!-- Детальна підсумкова таблиця -->
    <div class="summary-container">
        <table class="summary-table">
            <thead>
                <tr>
                    <th>Герої зміни</th>
                    <th>Змін</th>
                    <th>Базові</th>
                    <th>Біржа</th>
                    <th>Всього</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>⚡ R. V.</td>
                    <td id="sellerDays" class="highlight-count">0</td>
                    <td id="sellerBaseHours">0г</td>
                    <td id="sellerBirzhaHours">0г</td>
                    <td id="sellerTotalHours" class="total-val">0г</td>
                </tr>
                <tr>
                    <td>🛡️ D SkV</td>
                    <td id="loaderDays" class="highlight-count">0</td>
                    <td id="loaderBaseHours">0г</td>
                    <td id="loaderBirzhaHours">0г</td>
                    <td id="loaderTotalHours" class="total-val">0г</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td><strong>Усього</strong></td>
                    <td id="grandTotalDays" class="highlight-count"><strong>0</strong></td>
                    <td id="grandBaseHours"><strong>0г</strong></td>
                    <td id="grandBirzhaHours"><strong>0г</strong></td>
                    <td id="grandTotalHours" class="total-val"><strong>0г</strong></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- Кнопки дій -->
    <div class="actions">
        <button id="exportExcel" class="secondary">Експортувати в Excel</button>
        <button id="clearMonth" class="danger">Очистити місяць</button>
    </div>

    <!-- Підключення бібліотек та скриптів -->
     <!-- Підключення Firebase SDK (v10 Modular) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getFirestore, 
    doc, 
    getDoc, 
    setDoc, 
    onSnapshot,
    enableIndexedDbPersistence 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Твої конфігураційні дані з Firebase Console
const firebaseConfig = {
  apiKey: "AIzaSyD6IXhEjnRlj5D7hEVi-33Hm16p_plcF2U",
  authDomain: "worktimerv.firebaseapp.com",
  projectId: "worktimerv",
  storageBucket: "worktimerv.firebasestorage.app",
  messagingSenderId: "1097943492918",
  appId: "1:1097943492918:web:3d8ee7f9f11c1622c9eb97",
  measurementId: "G-TSZ633RKTK"
};

  // Ініціалізація
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Вмикаємо офлайн-режим (робота без інтернету)
  enableIndexedDbPersistence(db).catch((err) => {
    console.log("Офлайн режим не розгортається:", err.code);
  });

  // Робимо Firestore доступним глобально для script1.js
  window.db = db;
  window.doc = doc;
  window.setDoc = setDoc;
  window.onSnapshot = onSnapshot;
</script>

    <!-- Підключення бібліотек та скриптів -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.1/xlsx.full.min.js"></script>
    <script src="script1.js"></script>
</body>
</html>
